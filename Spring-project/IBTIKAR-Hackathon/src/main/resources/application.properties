spring.application.name=IBTIKAR-Hackathon
server.port=8080

# H2 Database in FILE mode
spring.datasource.url=jdbc:h2:file:./data/wildfire;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Static snapshots mapping
spring.web.resources.static-locations=classpath:/static/,file:./snapshots/

# OpenApi documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
